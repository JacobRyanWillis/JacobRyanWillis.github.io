services:
  directus:
    image: directus/directus:11
    container_name: portfolio-directus
    ports:
      - "8055:8055"
    volumes:
      - directus_data:/directus/database
      - directus_uploads:/directus/uploads
    environment:
      SECRET: ${DIRECTUS_SECRET:-portfolio-local-dev-secret}
      DB_CLIENT: sqlite3
      DB_FILENAME: /directus/database/data.db
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:-portfolio}
      WEBSOCKETS_ENABLED: "true"
      CORS_ENABLED: "true"
      CORS_ORIGIN: "http://localhost:3000"
      # Allow the Nuxt dev server to be framed by the Visual Editor module
      CONTENT_SECURITY_POLICY_DIRECTIVES__FRAME_SRC: "http://localhost:3000"

volumes:
  directus_data:
  directus_uploads:
